<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMO - Mail Aliases Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>MAMO</h1>
            <p>Mail Aliases Manager for OVH</p>
        </header>

        <nav id="toolbar">
            <button id="btn-new">+ New Alias</button>
            <button id="btn-sync">Sync with OVH</button>
            <select id="domain-filter"></select>
            <input type="text" id="search" placeholder="Search aliases...">
            <button id="btn-api-keys">API Keys</button>
            <button id="btn-settings">Settings</button>
        </nav>

        <main>
            <table id="aliases-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Created</th>
                        <th>Alias</th>
                        <th>To</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="aliases-body">
                </tbody>
            </table>
        </main>

        <div id="modal-settings" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <form id="settings-form">
                    <label>
                        Endpoint:
                        <select id="endpoint">
                            <option value="ovh-eu">OVH Europe</option>
                            <option value="ovh-us">OVH US</option>
                            <option value="ovh-ca">OVH Canada</option>
                        </select>
                    </label>
                    <label>
                        Application Key:
                        <input type="text" id="app-key" required>
                    </label>
                    <label>
                        Application Secret:
                        <input type="password" id="app-secret" required>
                    </label>
                    <label>
                        Consumer Key:
                        <input type="text" id="consumer-key" required>
                    </label>
                    <label>
                        Domains (comma-separated):
                        <input type="text" id="domains" placeholder="example.com,example.org">
                    </label>
                    <label>
                        Default Destination:
                        <input type="email" id="default-dest" placeholder="you@example.com">
                    </label>
                    <div class="connection-test">
                        <button type="button" id="btn-test-connection">Test Connection</button>
                        <button type="button" id="btn-request-credential" class="btn-secondary">Request Credentials</button>
                        <span id="connection-status"></span>
                    </div>
                    <div id="credential-info" class="credential-info hidden"></div>
                    <div class="form-actions">
                        <button type="submit">Save</button>
                        <button type="button" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modal-alias" class="modal hidden">
            <div class="modal-content">
                <h2 id="alias-modal-title">New Alias</h2>
                <form id="alias-form">
                    <input type="hidden" id="alias-id">
                    <label>
                        Name:
                        <input type="text" id="alias-name" placeholder="Work Email">
                    </label>
                    <label>
                        Alias:
                        <div class="input-group">
                            <input type="text" id="alias-address" placeholder="work">
                            <span id="alias-domain">@example.com</span>
                            <button type="button" id="btn-random">Random</button>
                        </div>
                    </label>
                    <label>
                        To:
                        <input type="email" id="alias-to" placeholder="destination@example.com">
                    </label>
                    <div class="form-actions">
                        <button type="submit">Save</button>
                        <button type="button" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modal-sync" class="modal hidden">
            <div class="modal-content">
                <h2>Sync with OVH</h2>
                <div id="sync-actions" class="sync-actions">
                    <button id="btn-pull" class="btn-sync-action">Pull from OVH</button>
                    <button id="btn-push" class="btn-sync-action">Push to OVH</button>
                    <button id="btn-delete-remote" class="btn-sync-action btn-delete">Delete from OVH</button>
                </div>
                <div id="sync-results">
                    <p>Choose an action above.</p>
                </div>
                <button class="btn-close">Close</button>
            </div>
        </div>

        <div id="modal-api-keys" class="modal hidden">
            <div class="modal-content">
                <h2>API Keys</h2>
                <div class="tab-nav">
                    <button class="tab-btn active" data-tab="credentials">Consumer Keys</button>
                    <button class="tab-btn" data-tab="applications">Application Keys</button>
                </div>

                <div id="tab-credentials" class="tab-content">
                    <div class="tab-toolbar">
                        <button id="btn-create-credential" class="btn-sync-action">Create New Key</button>
                    </div>
                    <div id="credentials-list" class="key-list"></div>
                    <div id="create-credential-panel" class="create-credential-panel hidden">
                        <h3>Create New Consumer Key</h3>
                        <div id="rules-container"></div>
                        <button type="button" id="btn-add-rule" class="btn-secondary">Add Rule</button>
                        <label>
                            Redirection URL (optional):
                            <input type="text" id="credential-redirection" placeholder="https://localhost/callback">
                        </label>
                        <div class="form-actions">
                            <button type="button" id="btn-submit-credential" class="btn-sync-action">Create</button>
                            <button type="button" id="btn-cancel-credential" class="btn-cancel">Cancel</button>
                        </div>
                        <div id="credential-result" class="credential-info hidden"></div>
                    </div>
                </div>

                <div id="tab-applications" class="tab-content hidden">
                    <div id="applications-list" class="key-list"></div>
                </div>

                <button class="btn-close">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
